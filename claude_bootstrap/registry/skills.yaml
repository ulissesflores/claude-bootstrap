# Curated skills registry for claude-bootstrap.
#
# Each entry MUST have: name, description, source, tier, profiles.
# Optional: invocation, evidence_url, last_validated_at, version.
#
# Tiers (a required label + the `skill list --tier` filter — no tier installs anything;
# bundles install from each profile's profile.yaml, not from this registry):
#   1 = core/essential
#   2 = recommended
#   3 = experimental (marked unstable)
# Single source for what tier does and does not claim: docs/04-skills-curated.md §2.
#
# Source types:
#   local: path inside this repo (templates/profiles/<profile>/skills/<name>/)
#   github: git repo with skill at given subpath
#
# Validation date: 2026-08-11 (all 13 github subpaths resolved live at upstream HEAD via the GitHub contents API)
#
# ---------------------------------------------------------------------------

