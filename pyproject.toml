[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-bootstrap"
version = "1.0.0"
description = "Universal bootstrap framework for Claude Code projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Ulisses Flores", email = "c.ulisses@gmail.com" }]
requires-python = ">=3.11"
keywords = ["claude", "claude-code", "bootstrap", "scaffolding", "ai-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "jinja2>=3.0",
    "pyyaml>=6.0",
    "questionary>=1.10",
    "rich>=13.0",
]

[project.scripts]
claude-bootstrap = "claude_bootstrap.cli:main"

[project.urls]
Homepage = "https://github.com/ulissesflores/claude-bootstrap"
Documentation = "https://github.com/ulissesflores/claude-bootstrap/blob/main/docs/00-overview.md"
Repository = "https://github.com/ulissesflores/claude-bootstrap.git"
Changelog = "https://github.com/ulissesflores/claude-bootstrap/blob/main/CHANGELOG.md"
Issues = "https://github.com/ulissesflores/claude-bootstrap/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "pre-commit>=3.0", "ruff>=0.7", "cffconvert>=2.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["claude_bootstrap*"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Bundled third-party skills ship their own scripts under their own style.
# We redistribute them verbatim (provenance-pinned) — linting them is out of scope.
extend-exclude = ["claude_bootstrap/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source = ["claude_bootstrap"]
# Bundled third-party skills ship their own scripts; they are redistributed verbatim and are
# never imported by this package, so counting them would only dilute the number.
omit = ["claude_bootstrap/templates/*"]

[tool.coverage.report]
# In-process coverage only. The subprocess tests (conftest.run_python) spawn `uv run --no-project`,
# a separate environment where pytest-cov's tracer never loads — their exercise of the code is
# real but invisible here, so the true figure is higher than what this reports.
exclude_also = ["if __name__ == .__main__.:"]

[tool.pytest.ini_options]
# Only collect tests under tests/ — third-party SKILL.md bundles (e.g. K-Dense)
# may ship their own test files that aren't relevant to claude-bootstrap.
testpaths = ["tests"]
norecursedirs = ["claude_bootstrap/templates", ".git", ".venv", "build", "dist"]
# Repo root on sys.path so tests can import claude_bootstrap.* in-process
# (subprocess tests use conftest.run_python; unit tests import directly).
pythonpath = ["."]
