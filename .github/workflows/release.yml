name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.3.0)"
        required: true
        type: string

jobs:
  test:
    name: Test suite (release gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Run tests
        run: |
          uv run --with pytest --with jinja2 --with pyyaml --with rich --with questionary \
            --no-project pytest tests/ -q

      - name: PII scan
        run: python3 scripts/pii-scan.py

  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - name: Verify built artifacts
        run: |
          ls -la dist/
          test -f dist/*.whl
          test -f dist/*.tar.gz

      # MANIFEST.in recursive-includes templates/ and the build reads the filesystem, not git,
      # so an untracked leftover would be published to PyPI and DOI-archived unattributed.
      - name: Every shipped file must be tracked in git
        run: python3 scripts/verify-wheel-tracked.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    # Trusted Publishing via OIDC — no PyPI token needed.
    # Setup once at https://pypi.org/manage/account/publishing/ — bind project to this workflow.
    environment:
      name: pypi
      url: https://pypi.org/p/claude-bootstrap
    permissions:
      id-token: write  # required for OIDC
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach artifacts to GitHub Release
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          [[ -z "$TAG" || "$TAG" == "${GITHUB_REF}" ]] && TAG="${{ inputs.version }}"
          gh release upload "$TAG" dist/* --clobber
